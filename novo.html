<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar site — SiteForge AI</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="top"><a class="logo" href="/dashboard.html">✦ SiteForge <b>AI</b></a></header><main class="form-page"><div class="form-head"><span class="pill">✨ Gerador IA</span><h1>Conte sobre seu site</h1><p>Depois você poderá editar tudo.</p></div><form id="generator" class="panel"><label>Nome<input id="name" required placeholder="Ex.: Bella Store"></label><label>Tipo de negócio<input id="business" required placeholder="Ex.: loja de roupas"></label><label>Descrição<textarea id="description"></textarea></label><label>Público-alvo<input id="audience"></label><div class="two"><label>Estilo<select id="style"><option>Moderno</option><option>Premium</option><option>Minimalista</option><option>Elegante</option><option>Colorido</option></select></label><label>Cor<input id="primaryColor" type="color" value="#7c3aed"></label></div><div class="two"><label>WhatsApp<input id="whatsapp"></label><label>Instagram<input id="instagram"></label></div><label>Endereço<input id="address"></label><label>Funcionalidades<textarea id="features" placeholder="Ex.: catálogo, formulário, depoimentos, WhatsApp..."></textarea></label><button class="btn full">✨ Gerar com IA</button><div id="msg"></div></form></main><script src="/js/new.js"></script></body></html>
